<!DOCTYPE html>
<html lang="zh-CN" data-theme="slate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>密保重置密码 · 外贸询盘助手</title>
<script type="text/javascript">
(function() {
  try {
    var t = localStorage.getItem('mb_theme') || 'slate';
    document.documentElement.setAttribute('data-theme', t);
  } catch(e) {}
})();
</script>
<link rel="stylesheet" href="/static/style.css?v=20260919-theme">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>重置管理员密码</h1>
    <p class="sub">通过密保安全问题验证并设定新登录密码</p>

    {% if err %}<div class="alert err">{{ err }}</div>{% endif %}

    {% if not has_question %}
    <div class="alert warn" style="margin-top:16px;">
      系统尚未设置密保问题，无法通过密保自服务找回密码。<br>
      请登录服务器通过修改环境变量 <code>MB_ADMIN_PASS_HASH</code> 重设密码。
    </div>
    <div style="margin-top:20px;text-align:center;">
      <a href="/login" class="btn" style="display:inline-block;">返回登录页</a>
    </div>
    {% else %}
    <form method="post" action="/forgot-password">
      <div class="saved-box" style="margin-bottom:14px;background:rgba(24,95,165,0.06);border-color:rgba(24,95,165,0.25);">
        <div style="font-size:12px;color:var(--primary);font-weight:600;margin-bottom:4px;">🛡️ 密保安全问题：</div>
        <div style="font-size:14px;font-weight:600;color:var(--text-1);">{{ question }}</div>
      </div>

      <div class="form-row">
        <label class="field">密保问题答案</label>
        <input type="text" name="security_answer" placeholder="请输入密保答案" required autocomplete="off" autofocus>
      </div>

      <div class="form-row">
        <label class="field">新登录密码</label>
        <input type="password" name="new_password" placeholder="至少 6 位字符" minlength="6" required autocomplete="new-password">
      </div>

      <div class="form-row">
        <label class="field">确认新密码</label>
        <input type="password" name="confirm_password" placeholder="再次输入新密码" minlength="6" required autocomplete="new-password">
      </div>

      <button class="btn primary" type="submit" style="width:100%;">验证密保并重置密码</button>
      <div style="display:flex;justify-content:center;margin-top:14px;">
        <a href="/login" style="font-size:12.5px;color:var(--text-3);text-decoration:none;">想起密码了？返回登录</a>
      </div>
    </form>
    {% endif %}

    <p class="hint" style="margin-top:18px;text-align:center;">
      本系统仅监听本机，通过 SSH 隧道访问
    </p>
  </div>
</div>
</body>
</html>
